      linea_id:
        example: 1
        type: integer
      nombre_ramal:
        example: IDA
        type: string
      ramal_id:
        example: 1
        type: integer
      ramal_num:
        example: 1
        type: integer
      shape_gtfs:
        example: STC_L1_IDA
        type: string
      tam_km:
        example: 18.8
        type: number
    type: object
externalDocs:
  description: Github
  url: https://github.com/galigaribaldi/Apimetro
host: localhost:8080
info:
  contact:
    email: galigaribaldi0@gmail.com
    name: galigaribaldi (Galileo Cabrera Garibaldi)
  description: |-
    API de datos geoespaciales sobre el sistema de transporte público de la Ciudad de México y Área Metropolitana.
    Ofrece dos tipos de respuesta: descriptiva (JSON) con datos operativos de líneas y estaciones,
    y geográfica (GeoJSON) con geometrías listas para renderizar en mapas interactivos.
    Cubre los sistemas: METRO, Metrobús (MB), Cablebús (CBB), RTP, Trolebús (TROLE),
    Tren Ligero (TL), Mexicable, Mexibús, Interurbano, Cable Car (CC) y CETRAM.
    Base path: /movilidad — Documentación: /swagger/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Apimetro — API de Movilidad CDMX
  version: "1.0"
paths:
  /{sistema}/descripcion-estacion:
    get:
      consumes:
      - application/json
      description: |-
        Retorna registros descriptivos e históricos de estaciones de transporte.
        Complementa los datos de la tabla principal de Estaciones con información histórica o alternativa.
        Incluye clave oficial (cve_est), tipo, alcaldía y año de apertura.
        Si el sistema es TODOS, devuelve descripciones de todos los sistemas.
      parameters:
      - description: 'Sistema de transporte. Valores: METRO, MB, CBB, RTP, TROLE,
          TL, MEXIBUS, MEXICABLE, INTERURBANO, CC, TODOS'
        in: path
        name: sistema
        required: true
        type: string
      - description: ID interno del registro de descripción
        in: query
        name: id
        type: integer
      - description: 'Nombre de la estación (ej: ''Tacubaya''). Búsqueda parcial.'
        in: query
        name: nombre
        type: string
      - description: 'Alcaldía o municipio donde se ubica (ej: ''Miguel Hidalgo'',
          ''Ecatepec de Morelos'')'
        in: query
        name: alcaldia_municipio
        type: string
      - description: 'Número o clave comercial de la línea a la que pertenece (ej:
          ''1'')'
        in: query
        name: num_comercial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lista de descripciones de estación
          schema:
            items:
              $ref: '#/definitions/models.DescripcionEstacion'
            type: array
        "400":
          description: Parámetros inválidos
          schema:
            additionalProperties: true
            type: object
        "404":
          description: No se encontraron registros
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties: true
            type: object
      summary: Consultar Descripciones de Estación
      tags:
      - DescripcionEstacion
    post:
      consumes:
      - application/json
      description: |-
        Registra una nueva descripción histórica o informativa para una estación.
        Debe asociarse a una estación existente mediante el campo `estacion_id`.
      parameters:
      - description: Sistema de transporte
        in: path
        name: sistema
        required: true
        type: string
      - description: Objeto DescripcionEstacion con los datos a registrar
        in: body
        name: descripcion
        required: true
        schema:
          $ref: '#/definitions/models.DescripcionEstacion'
      produces:
      - application/json
      responses:
        "201":
          description: Descripción de estación creada con éxito
          schema:
            additionalProperties: true
            type: object
        "400":
          description: JSON inválido o campos requeridos faltantes
          schema:
            additionalProperties: true
            type: object
      summary: Crear Descripción de Estación
      tags:
      - DescripcionEstacion
  /{sistema}/descripcion-estacion/{id}:
    delete:
      consumes:
      - application/json
      description: Elimina un registro de descripción de estación por su ID. Esta
        operación es irreversible.
      parameters:
      - description: Sistema de transporte
        in: path
        name: sistema
        required: true
        type: string
      - description: ID del registro de descripción a eliminar
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Descripción de estación eliminada con éxito
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties: true
            type: object
      summary: Eliminar Descripción de Estación
      tags:
      - DescripcionEstacion
    put:
      consumes:
      - application/json
      description: Reemplaza completamente el registro de descripción de estación
        con el ID indicado.
      parameters:
      - description: Sistema de transporte
        in: path
        name: sistema
        required: true
        type: string
      - description: ID del registro a actualizar
        in: path
        name: id
        required: true
        type: integer
      - description: Objeto DescripcionEstacion con los datos actualizados
        in: body
        name: descripcion
        required: true
        schema:
          $ref: '#/definitions/models.DescripcionEstacion'
      produces:
      - application/json
      responses:
        "200":
          description: Descripción de estación actualizada con éxito
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido o JSON mal formado
          schema:
            additionalProperties: true
            type: object
      summary: Actualizar Descripción de Estación
      tags:
      - DescripcionEstacion
  /{sistema}/descripcion-linea:
    get:
      consumes:
      - application/json
      description: |-
        Retorna registros descriptivos e históricos de líneas de transporte.
        Incluye información sobre terminales originales, tipo de línea, dirección, ampliaciones y descripción textual.
        Útil para construir fichas informativas o mostrar la historia de una línea.
        Si el sistema es TODOS, devuelve descripciones de todos los sistemas.
      parameters:
      - description: 'Sistema de transporte. Valores: METRO, MB, CBB, RTP, TROLE,
          TL, MEXIBUS, MEXICABLE, INTERURBANO, CC, TODOS'
        in: path
        name: sistema
        required: true
        type: string
      - description: ID interno del registro de descripción
        in: query
        name: id
        type: integer
      - description: 'Nombre de la terminal original de la línea (ej: ''Observatorio'',
          ''Pantitlán'')'
        in: query
        name: terminal_original
        type: string
      - description: 'ID de la línea base a la que corresponde esta descripción (ej:
          ''1'')'
        in: query
        name: linea_base
        type: string
      - description: 'Número o clave comercial de la línea (ej: ''1'', ''A'', ''B'')'
        in: query
        name: num_comercial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lista de descripciones de línea
          schema:
            items:
              $ref: '#/definitions/models.DescripcionLinea'
            type: array
        "400":
          description: Parámetros inválidos
          schema:
            additionalProperties: true
            type: object
        "404":
          description: No se encontraron registros
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties: true
            type: object
      summary: Consultar Descripciones de Línea
      tags:
      - DescripcionLinea
    post:
      consumes:
      - application/json
      description: |-
        Registra una nueva descripción histórica o informativa para una línea de transporte.
        Debe asociarse a una línea existente mediante el campo `linea_base`.
      parameters:
      - description: Sistema de transporte
        in: path
        name: sistema
        required: true
        type: string
      - description: Objeto DescripcionLinea con los datos a registrar
        in: body
        name: descripcion
        required: true
        schema:
          $ref: '#/definitions/models.DescripcionLinea'
      produces:
      - application/json
      responses:
        "201":
          description: Descripción de línea creada con éxito
          schema:
            additionalProperties: true
            type: object
        "400":
          description: JSON inválido o campos requeridos faltantes
          schema:
            additionalProperties: true
            type: object
      summary: Crear Descripción de Línea
      tags:
      - DescripcionLinea
  /{sistema}/descripcion-linea/{id}:
    delete:
      consumes:
      - application/json
      description: Elimina un registro de descripción de línea por su ID. Esta operación
        es irreversible.
      parameters:
      - description: Sistema de transporte
        in: path
        name: sistema
        required: true
        type: string
      - description: ID del registro de descripción a eliminar
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Descripción eliminada con éxito
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties: true
            type: object
      summary: Eliminar Descripción de Línea
      tags:
      - DescripcionLinea
    put:
      consumes:
      - application/json
      description: |-
        Reemplaza completamente el registro de descripción de línea con el ID indicado.
        A diferencia de PATCH, PUT requiere enviar el objeto completo.
      parameters:
      - description: Sistema de transporte
        in: path
        name: sistema
        required: true
        type: string
      - description: ID del registro a actualizar
        in: path
        name: id
        required: true
        type: integer
      - description: Objeto DescripcionLinea con los datos actualizados
        in: body
        name: descripcion
        required: true
        schema:
          $ref: '#/definitions/models.DescripcionLinea'
      produces:
      - application/json
      responses:
        "200":
          description: Descripción actualizada con éxito
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido o JSON mal formado
          schema:
            additionalProperties: true
            type: object
      summary: Actualizar Descripción de Línea
      tags:
      - DescripcionLinea
  /{sistema}/estacion:
    delete:
      consumes:
      - application/json
      description: Elimina una estación por su ID interno. Esta operación es irreversible.
      parameters:
      - description: Sistema de transporte
        in: path
        name: sistema
        required: true
        type: string
      - description: 'ID interno de la estación a eliminar (ej: ?id=10)'
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Estación eliminada con éxito
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido o faltante
          schema:
            additionalProperties: true
            type: object
      summary: Eliminar Estación de Transporte
      tags:
      - Estacion
    get:
      consumes:
      - application/json
      description: |-
        Retorna datos descriptivos (JSON) de estaciones del sistema indicado en la ruta.
        Si el sistema es TODOS, devuelve estaciones de todos los sistemas disponibles.
        Los CETRAM (Centros de Transferencia Modal) son nodos multimodales donde convergen varios sistemas.
        La búsqueda por nombre usa coincidencia parcial (ILIKE) y normaliza caracteres especiales (ñ, tildes).
      parameters:
      - description: 'Sistema de transporte. Valores: METRO, MB, CBB, RTP, TROLE,
          TL, MEXIBUS, MEXICABLE, INTERURBANO, CC, TODOS'
        in: path
        name: sistema
        required: true
        type: string
      - description: ID interno de la estación en la base de datos
        in: query
        name: id
        type: integer
      - description: 'Nombre de la estación (ej: ''Tacubaya''). Búsqueda parcial e
          insensible a mayúsculas.'
        in: query
        name: nombre
        type: string
      - description: ID interno de la línea a la que pertenece la estación
        in: query
        name: linea_id
        type: integer
      - description: 'Alcaldía (CDMX) o municipio del Área Metropolitana (ej: ''Miguel
          Hidalgo'', ''Naucalpan de Juárez'')'
        in: query
        name: alcaldia_municipio
        type: string
      - description: 'Número o clave comercial de la línea (ej: ''1'', ''MB1'')'
        in: query
        name: num_comercial
        type: string
      - description: 'Color identificador de la línea en español (ej: ''Rosa'', ''Azul'',
          ''Naranja'')'
        in: query
        name: color_esp
        type: string
      - description: 'Color identificador de la línea en inglés (ej: ''Pink'', ''Blue'',
          ''Orange'')'
        in: query
        name: color_en
        type: string
      - description: 'Año de inauguración de la estación (ej: 1969)'
        in: query
        name: anio
        type: integer
      - description: true para filtrar únicamente estaciones que son CETRAM
        in: query
        name: es_cetram
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Lista de estaciones que coinciden con los filtros
          schema:
            items:
              $ref: '#/definitions/models.Estacion'
            type: array
        "400":
          description: Parámetros inválidos
          schema:
            additionalProperties: true
            type: object
        "404":
          description: No se encontraron estaciones
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties: true
            type: object
      summary: Consultar Estaciones de Transporte
      tags:
      - Estacion
    patch:
      consumes:
      - application/json
      description: |-
        Actualiza los datos de una estación por su ID interno.
        Se reemplazan todos los campos enviados en el body (comportamiento de PATCH con objeto completo).
      parameters:
      - description: Sistema de transporte
        in: path
        name: sistema
        required: true
        type: string
      - description: 'ID interno de la estación a actualizar (ej: ?id=10)'
        in: query
        name: id
        required: true
        type: integer
      - description: Objeto Estacion con los datos actualizados
        in: body
        name: estacion
        required: true
        schema:
          $ref: '#/definitions/models.Estacion'
      produces:
      - application/json
      responses:
        "200":
          description: Estación actualizada correctamente
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido o JSON mal formado
          schema:
            additionalProperties: true
            type: object
      summary: Actualizar Estación de Transporte
      tags:
      - Estacion
    post:
      consumes:
      - application/json
      description: |-
        Registra una nueva estación en el sistema especificado.
        Requiere al menos `nombre`, `sistema` y `linea_id` para asociarla a una línea existente.
      parameters:
      - description: Sistema de transporte
        in: path
        name: sistema
        required: true
        type: string
      - description: Objeto Estacion con los datos a registrar
        in: body
        name: estacion
        required: true
        schema:
          $ref: '#/definitions/models.Estacion'
      produces:
      - application/json
      responses:
        "201":
          description: Estación creada exitosamente
          schema:
            additionalProperties: true
            type: object
        "400":
          description: JSON inválido o campos requeridos faltantes
          schema:
            additionalProperties: true
            type: object
      summary: Crear Estación de Transporte
      tags:
      - Estacion
  /{sistema}/linea:
    delete:
      consumes:
      - application/json
      description: |-
        Elimina una línea por su ID interno. La operación es en cascada: también elimina
        los Ramales y las DescripcionLinea asociados a esa línea.
        Esta operación es irreversible.
      parameters:
      - description: Sistema de transporte
        in: path
        name: sistema
        required: true
        type: string
      - description: 'ID interno de la línea a eliminar (ej: ?id=5)'
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Línea y dependencias eliminadas correctamente
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido o faltante
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Error interno al eliminar de la base de datos
          schema:
            additionalProperties: true
            type: object
      summary: Eliminar Línea de Transporte
      tags:
      - Linea
    get:
      consumes:
      - application/json
      description: |-
        Retorna datos descriptivos (JSON) de líneas de transporte del sistema indicado en la ruta.
        Si el sistema es TODOS, devuelve líneas de todos los sistemas disponibles.
        Los filtros de texto usan búsqueda parcial insensible a mayúsculas (ILIKE) y soportan caracteres especiales.
        Los resultados incluyen relaciones anidadas: ramales y descripciones de línea.
      parameters:
      - description: 'Sistema de transporte. Valores: METRO, MB, CBB, RTP, TROLE,
          TL, MEXIBUS, MEXICABLE, INTERURBANO, CC, TODOS'
        in: path
        name: sistema
        required: true
        type: string
      - description: ID interno de la línea en la base de datos
        in: query
        name: id
        type: integer
      - description: 'Nombre descriptivo de la línea (ej: ''Línea 1'', ''Línea A'').
          Búsqueda parcial.'
        in: query
        name: nombre
        type: string
      - description: 'Número o clave comercial visible al usuario (ej: ''1'', ''A'',
          ''MB1'')'
        in: query
        name: num_comercial
        type: string
      - description: 'Nombre del ramal o variante de ruta (ej: ''Ramal Politécnico'')'
        in: query
        name: nombre_ramal
        type: string
      - description: 'Clasificación operativa. Valores: existente, eliminada, futura'
        in: query
        name: clasificacion
        type: string
      - description: 'Longitud total de la línea en kilómetros (ej: ''18.8'')'
        in: query
        name: tam_km
        type: string
      - description: true = líneas en operación activa, false = líneas discontinuadas
        in: query
        name: existe
        type: boolean
      - description: 'Filtra líneas con estaciones tipo CETRAM. Valores: true, false'
        in: query
        name: es_cetram
        type: string
      - description: 'Dirección del trazo. Valores: 1 (ida), 0 (regreso)'
        in: query
        name: sentido
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lista de líneas que coinciden con los filtros
          schema:
            items:
              $ref: '#/definitions/models.Linea'
            type: array
        "400":
          description: Parámetros inválidos en la solicitud
          schema:
            additionalProperties: true
            type: object
        "404":
          description: No se encontraron líneas con los filtros dados
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties: true
            type: object
      summary: Consultar Líneas de Transporte
      tags:
      - Linea
    patch:
      consumes:
      - application/json
      description: |-
        Actualiza parcialmente los datos de una línea por su ID interno.
        Solo se actualizan los campos enviados en el body (PATCH semántico).
        El campo `linea_id` es ignorado aunque se envíe en el body (protección de integridad).
      parameters:
      - description: Sistema de transporte
        in: path
        name: sistema
        required: true
        type: string
      - description: 'ID interno de la línea a actualizar (ej: ?id=5)'
        in: query
        name: id
        required: true
        type: integer
      - description: 'Campos a actualizar. Ej: {\'
        in: body
        name: linea
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Línea actualizada correctamente
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido o JSON mal formado
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Error interno al actualizar en la base de datos
          schema:
            additionalProperties: true
            type: object
      summary: Actualizar Línea de Transporte
      tags:
      - Linea
    post:
      consumes:
      - application/json
      description: |-
        Crea un nuevo registro de línea de transporte en el sistema.
        Si no se especifica `sistema` en el body, se asigna 'METRO' por defecto.
        La geometría (`geom`) debe enviarse en formato WKT (Well-Known Text) si se incluye.
      parameters:
      - description: Sistema de transporte
        in: path
        name: sistema
        required: true
        type: string
      - description: 'Objeto Linea con los datos a registrar. Campos requeridos: nombre,
          sistema.'
        in: body
        name: linea
        required: true
        schema:
          $ref: '#/definitions/models.Linea'
      produces:
      - application/json
      responses:
        "201":
          description: Línea creada exitosamente
          schema:
            $ref: '#/definitions/models.Linea'
        "400":
          description: JSON inválido o campos requeridos faltantes
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Error interno al guardar en la base de datos
          schema:
            additionalProperties: true
            type: object
      summary: Crear Línea de Transporte
      tags:
      - Linea
  /mapas/geojsonEstacion:
    get:
      consumes:
      - application/json
      description: |-
        Retorna estaciones de transporte público en formato GeoJSON (FeatureCollection).
        Cada Feature contiene una geometría tipo `Point` (longitud/latitud) y un objeto `properties`
        con atributos como nombre, sistema, alcaldía, número comercial, año y datos de CETRAM.
        Si no se especifica `sistema`, se devuelven estaciones de todos los sistemas.
        Los textos con caracteres especiales (ñ, tildes) se normalizan automáticamente.
      parameters:
      - description: 'Sistema de transporte. Ej: METRO, MB, CBB, RTP, TROLE, TL, MEXIBUS,
          MEXICABLE, INTERURBANO, CC. Vacío = todos.'
        in: query
        name: sistema
        type: string
      - description: 'Número o clave comercial de la línea (ej: ''1'', ''A'', ''MB1'')'
        in: query
        name: num_comercial
        type: string
      - description: 'Alcaldía (CDMX) o municipio del Área Metropolitana donde se
          ubica la estación (ej: ''Cuauhtémoc'')'
        in: query
        name: alcaldia_municipio
        type: string
      - description: 'Nombre del ramal o variante de ruta al que pertenece la estación
          (ej: ''Ramal Politécnico'')'
        in: query
        name: nombre_ramal
        type: string
      - description: 'Jerarquía del sistema. Ej: ''Línea principal'', ''Ramal'''
        in: query
        name: jerarquia_transporte
        type: string
      - description: 'Tipo de infraestructura vial. Valores: Superficie, Elevado,
          Subterráneo'
        in: query
        name: derecho_de_via
        type: string
      - description: 'Filtra estaciones que son o colindan con un CETRAM (Centro de
          Transferencia Modal). Valores: true, false'
        in: query
        name: es_cetram
        type: string
      - description: 'Nombre del CETRAM (ej: ''Indios Verdes'', ''Tacubaya''). Aplica
          solo si es_cetram=true'
        in: query
        name: nombre_cetram
        type: string
      - description: Nombre de un CETRAM para buscar estaciones en un radio de 250
          metros a su alrededor
        in: query
        name: cetram_real
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: FeatureCollection con estaciones encontradas
          schema:
            $ref: '#/definitions/models.FeatureCollection'
        "404":
          description: No se encontraron estaciones con los filtros proporcionados
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Error interno del servidor al ejecutar la consulta espacial
          schema:
            additionalProperties: true
            type: object
      summary: GeoJSON de Estaciones
      tags:
      - GeoJSON
  /mapas/geojsonLinea:
    get:
      consumes:
      - application/json
      description: |-
        Retorna trazos de líneas de transporte en formato GeoJSON (FeatureCollection).
        Cada Feature contiene la geometría del trazo (`LineString` o `MultiLineString`) y un objeto
        `properties` con métricas operativas: velocidad promedio (km/h), frecuencia (min),
        capacidad del vehículo, distancia en metros, derecho de vía y jerarquía de transporte.
        Los trazos se obtienen de la tabla Ramales, enriquecidos con datos de HistoricoOperacion.
        Si no se especifica `sistema`, se devuelven trazos de todos los sistemas.
      parameters:
      - description: 'Sistema de transporte. Ej: METRO, MB, CBB, RTP, TROLE, TL, MEXIBUS,
          MEXICABLE, INTERURBANO, CC. Vacío = todos.'
        in: query
        name: sistema
        type: string
      - description: 'Número o clave comercial de la línea (ej: ''1'', ''A'', ''MB1'')'
        in: query
        name: num_comercial
        type: string
      - description: 'Nombre del ramal o variante de ruta (ej: ''IDA'', ''REGRESO'',
          ''Ramal Politécnico'')'
        in: query
        name: nombre_ramal
        type: string
      - description: 'Jerarquía del sistema. Ej: ''Línea principal'', ''Ramal'''
        in: query
        name: jerarquia_transporte
        type: string
      - description: 'Tipo de infraestructura. Valores: Superficie, Elevado, Subterráneo'
        in: query
        name: derecho_de_via
        type: string
      - description: 'Filtra trazos que pasan por un CETRAM. Valores: true, false'
        in: query
        name: es_cetram
        type: string
      - description: 'Dirección del trazo. Valores: 1 (ida / hacia terminal), 0 (regreso
          / hacia origen)'
        in: query
        name: sentido
        type: string
      - description: 'Filtra por líneas actualmente operativas. Valores: true (en
          operación), false (discontinuadas)'
        in: query
        name: existe
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: FeatureCollection con trazos de líneas y métricas operativas
          schema:
            $ref: '#/definitions/models.FeatureCollection'
        "404":
          description: No se encontraron trazos con los filtros proporcionados
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Error interno del servidor al ejecutar la consulta espacial
          schema:
            additionalProperties: true
            type: object
      summary: GeoJSON de Líneas de Transporte
      tags:
      - GeoJSON
  /mapas/geojsonPoligono:
    get:
      consumes:
      - application/json
      description: |-
        Retorna límites administrativos en formato GeoJSON (FeatureCollection).
        Cubre alcaldías de la CDMX, municipios del Área Metropolitana y entidades federativas.
        Las geometrías son de tipo `Polygon` o `MultiPolygon`, útiles para delimitar zonas en mapas.
        Si no se aplican filtros, devuelve todos los polígonos disponibles en la base de datos.
      parameters:
      - description: 'Entidad federativa. Ej: ''CDMX'', ''Estado de México'', ''Hidalgo'',
          ''Morelos'''
        in: query
        name: entidad
        type: string
      - description: 'Nivel administrativo. Valores: alcaldia (circunscripciones de
          CDMX), municipio (Área Metropolitana), entidad (nivel estatal)'
        in: query
        name: nivel
        type: string
      - description: 'Nombre exacto del polígono (ej: ''Cuauhtémoc'', ''Naucalpan
          de Juárez'', ''Ecatepec de Morelos'')'
        in: query
        name: nombre
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: FeatureCollection con polígonos administrativos
          schema:
            $ref: '#/definitions/models.FeatureCollection'
        "500":
          description: Error interno del servidor al ejecutar la consulta espacial
          schema:
            additionalProperties: true
            type: object
      summary: GeoJSON de Polígonos Administrativos
      tags:
      - GeoJSON
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"
