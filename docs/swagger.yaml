basePath: /movilidad
definitions:
  models.DescripcionEstacion:
    properties:
      alcaldia_municipio:
        example: Miguel Hidalgo
        type: string
      anio:
        example: "1970"
        type: string
      cve_est:
        example: TAC
        type: string
      descripcion_estacion_id:
        example: 1
        type: integer
      estacion_id:
        example: 1
        type: integer
      estado_ciudad:
        example: Ciudad de México
        type: string
      longitud:
        example: -99.188
        type: number
      nombre:
        example: Tacubaya
        type: string
      tipo:
        example: Terminal
        type: string
    type: object
  models.DescripcionLinea:
    properties:
      anio_fin_ampliacion:
        example: 1986
        type: integer
      anio_inicio_ampliacion:
        example: 1984
        type: integer
      descripcion:
