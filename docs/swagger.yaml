      direccion:
        type: string
      inicio_original:
        type: string
      linea_base:
        type: integer
      terminal_original:
        type: string
      tipo_linea:
        type: string
    type: object
  models.Estacion:
    properties:
      alcaldia_municipio:
        example: Miguel Hidalgo
        type: string
      anio:
        example: "1980"
        type: string
      cve_est:
        example: TAC
        type: string
      es_cetram:
        example: false
        type: boolean
      estacion_id:
        example: 1
        type: integer
      estacion_id_oficial:
        example: 1001
        type: integer
      estado_ciudad:
        example: Ciudad de México
        type: string
      existe:
        example: true
        type: boolean
      latitud:
        example: 19.403
        type: number
      linea_id:
        example: 1
        type: integer
      longitud:
        example: -99.188
        type: number
      nombre:
        example: Tacubaya
        type: string
      nombre_cetram:
        example: Tacubaya CETRAM
        type: string
      num_estacion:
        example: 1
        type: integer
      sistema:
        example: METRO
        type: string
      stop_gtfs:
        example: STC_001
        type: string
      tipo:
        example: Terminal
        type: string
    type: object
  models.Feature:
    properties:
      geometry:
        allOf:
        - $ref: '#/definitions/models.Geometry'
        description: Geometría de tipo Point
      properties:
        additionalProperties: true
        description: Atributos dinámicos
        type: object
      type:
        description: '"Feature"'
        example: Feature
        type: string
    type: object
  models.FeatureCollection:
    properties:
      features:
        description: Lista de features (líneas o estaciones)
        items:
          $ref: '#/definitions/models.Feature'
        type: array
      type:
        description: '"FeatureCollection"'
        example: FeatureCollection
        type: string
    type: object
  models.Geometry:
    properties:
      coordinates:
        description: interface{} permite múltiples niveles de arreglos
      type:
        description: '"Point"'
        example: Point
        type: string
    type: object
  models.Linea:
    properties:
      anio_inauguracion:
        example: 1969
        type: integer
      capacidad_vehiculo:
        example: 1000
        type: integer
      clasificacion:
        example: existente
        type: string
      color_en:
        example: Pink
        type: string
      color_esp:
        example: Rosa
        type: string
      derecho_de_via:
        example: Superficie
        type: string
      descripcion_linea:
        items:
          $ref: '#/definitions/models.DescripcionLinea'
        type: array
      existe:
        example: true
        type: boolean
      geom:
        example: MULTILINESTRING(...)
        type: string
      jerarquia_transporte:
        example: Línea principal
        type: string
      linea_base_ramal:
        example: 1
        type: integer
      linea_id:
        example: 1
        type: integer
      nombre:
        example: Línea 1
        type: string
      num_comercial:
        example: "1"
        type: string
      ramal_id:
        example: 1
        type: integer
      ramales:
        items:
          $ref: '#/definitions/models.Ramal'
        type: array
      route_gtfs:
        example: L1
        type: string
      sistema:
        example: METRO
        type: string
      tam_km:
        example: 18.8
        type: number
    type: object
  models.Ramal:
    properties:
      anio_creacion:
        type: integer
      estado:
        type: string
      geom:
        type: string
      linea_id:
        type: integer
      nombre_ramal:
        type: string
      ramal_id:
        type: integer
      ramal_num:
        type: integer
      shape_gtfs:
        type: string
      tam_km:
        type: number
    type: object
